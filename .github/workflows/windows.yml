name: Windows CI
on: [push, pull_request]

jobs:
  msys2-ucrt64:
    if: true  # can be used to temporarily disable the build
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Install dependencies
        run: ./scripts/msys2-install-deps
      - name: Build python venv
        run: |
          # msys2's python is externally managed (PEP 668), so pip-installed packages go into a venv.
          # --system-site-packages: use the python packages installed via pacman.
          python -m venv --system-site-packages env
          . env/bin/activate
          pip install pyinstaller==6.22.3
      - name: Build
        run: |
          . env/bin/activate
          ./scripts/msys2-build
      - name: Test
        run: ./dist/borg.exe -V
      - uses: actions/upload-artifact@v7
        with:
          name: borg-windows
          path: dist/borg.exe
