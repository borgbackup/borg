repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.0.287
  hooks:
    - id: ruff
      # Use only this repo's config: without --config, this ruff version also parses any
      # pyproject.toml in parent directories and fails on newer settings it can't parse.
      args: [--config, pyproject.toml]
